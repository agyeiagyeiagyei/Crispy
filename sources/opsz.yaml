# Optical Size Adjustment Configuration
# This file defines how XOPQ, YOPQ, and XTRA values are adjusted
# when generating MinOPSZ (12) and MaxOPSZ (72) rows from base opsz (48)

base_opsz: 48  # Reference opsz (current CSV values)
min_opsz: 12   # Minimum optical size to generate
max_opsz: 72   # Maximum optical size to generate

# Weight-based adjustments for XOPQ and YOPQ
# Values are multipliers applied to base values
# Interpolation will occur between defined weight points
weight_adjustments:
  # Control points for interpolation
  - weight: 200  # ExtraLight
    min_opsz_multipliers: {xopq: 1.05, yopq: 1.05}  # Increase for small text at light weights
    max_opsz_multipliers: {xopq: 0.95, yopq: 0.95}  # Decrease for large display at light weights
  - weight: 400  # Regular (baseline, minimal adjustment)
    min_opsz_multipliers: {xopq: 1.0, yopq: 1.0}
    max_opsz_multipliers: {xopq: 1.0, yopq: 1.0}
  - weight: 700  # Bold
    min_opsz_multipliers: {xopq: 0.95, yopq: 0.95}  # Decrease for small text at heavy weights
    max_opsz_multipliers: {xopq: 1.05, yopq: 1.05}  # Increase for large display at heavy weights
  - weight: 900  # Black
    min_opsz_multipliers: {xopq: 0.92, yopq: 0.92}  # More decrease for small text
    max_opsz_multipliers: {xopq: 1.08, yopq: 1.08}  # More increase for large display

# XTRA adjustments for Condensed widths (wdth < 100)
# Applied in addition to weight-based adjustments
xtra_adjustments:
  condensed_widths:  # Applies when WDTH < 100
    min_opsz_multiplier: 1.05  # Increase XTRA by 5% for MinOPSZ in condensed
    max_opsz_multiplier: 1.0    # No change for MaxOPSZ in condensed
