name: Build font and specimen

on: [push, pull_request, workflow_dispatch]
permissions: write-all

env:
  # The source CI builds. Its avar2 mappings, grade and transform settings
  # come from the sibling Crispy-avar.csv / -grade.json / -transforms.json.
  SOURCE: sources/Crispy.glyphs
  # The studio owns the build now (it replaced the Makefile/gftools flow in
  # July). Install it from the branch the hosted demo deploys from until a
  # release carrying the current work exists.
  AVAR2_STUDIO: "avar2-studio @ git+https://github.com/agyeiagyeiagyei/avar2-studio@github-pages"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Setup fontspector
      uses: fonttools/setup-fontspector@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install toolset
      run: |
        sudo apt-get update
        sudo apt-get install -y ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "$AVAR2_STUDIO"
        avar2-studio doctor || true
    - name: Set artifact file name
      shell: bash
      run: echo "ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-fonts" >> $GITHUB_ENV

    - name: Build font (avar2-studio, headless)
      run: |
        rm -rf fonts
        avar2-studio build "$SOURCE" --out fonts/variable
        ls -la fonts/variable
    - name: Check with fontspector
      continue-on-error: true
      run: |
        mkdir -p out/fontspector
        fontspector --profile googlefonts -l warn --full-lists --succinct \
          --html out/fontspector/fontspector-report.html \
          --ghmarkdown out/fontspector/fontspector-report.md \
          fonts/variable/*.ttf \
          || echo "::warning title=fontspector::QA reported issues — see the report artifact."
    - name: Generate proofs
      run: |
        mkdir -p out/proof
        diffenator2 proof fonts/variable/*.ttf -o out/proof
    - name: Set up test result site
      run: |
        cat > out/index.html <<'HTML'
        <!doctype html><meta charset="utf-8"><title>Crispy — build results</title>
        <h1>Crispy build results</h1>
        <ul>
          <li><a href="proof/">Proofs (diffenator2)</a></li>
          <li><a href="fontspector/fontspector-report.html">Fontspector report</a></li>
        </ul>
        HTML
    - name: Collect deployment assets
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: |
          fonts
          out
    outputs:
      zip_name: ${{ env.ZIP_NAME }}

  deploy:
    name: Deploy results to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # There are two ways a release can be created: either by pushing a tag, or by
  # creating a release from the GitHub UI. Pushing a tag does not automatically
  # create a release, so we have to do that ourselves. However, creating a
  # release from the GitHub UI *does* push a tag, and we don't want to create
  # a new release in that case because one already exists!

  release:
    name: Release bundle
    if: contains(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Use font artifacts from CI
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
      - name: Copy ARTICLE.en_us.html to release directory
        run: cp documentation/ARTICLE.en_us.html ${{ env.ZIP_NAME }}/ARTICLE.en_us.html
        continue-on-error: true
      - name: Copy OFL.txt to release directory
        run: cp OFL.txt ${{ env.ZIP_NAME }}/OFL.txt
      - name: Remove proof/test outputs from release
        run: rm -rf ${{ env.ZIP_NAME }}/out
      - name: Set release file name
        shell: bash
        run: echo "RELEASE_ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-${{github.ref_name}}" >> $GITHUB_ENV
      - name: Create release bundle
        run: mv ${{ env.ZIP_NAME }} ${{ env.RELEASE_ZIP_NAME }}; zip -r ${{ env.RELEASE_ZIP_NAME }}.zip ${{ env.RELEASE_ZIP_NAME }}
      - name: Check for release
        id: create_release
        run: |
          if ! gh release view ${{ github.ref_name }}; then
          git show -s --format=%B ${{ github.ref_name }} | tail -n +4 | gh release create ${{ github.ref_name }} -t ${{ github.ref_name }} -F -
          fi
      - name: Populate release
        run: |
          gh release upload ${{ github.ref_name }} ${{ env.RELEASE_ZIP_NAME }}.zip --clobber
      - name: Set release live
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
