# Axis default values for variable fonts
# These values are used by set_axis_defaults.py to patch fvar table defaults
#
# Axis tags and their desired default values
# Values must be within the axis min/max range defined in the font

wght: 400.0  # Regular weight
wdth: 100.0  # Normal width
opsz: 72.0   # Display optical size
cntr: 0.0    # Normal contrast

